<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="goldStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD98A"/>
      <stop offset="100%" stop-color="#B98A3A"/>
    </linearGradient>
    <radialGradient id="centerStar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFAEB"/>
      <stop offset="60%" stop-color="#FFD98A"/>
      <stop offset="100%" stop-color="#F6C85F"/>
    </radialGradient>
  </defs>

  <!-- Android adaptive-icon foreground: NO background; the system uses the
       backgroundColor from app.json. Keep all art inside the safe zone
       (~66% of the canvas) so the launcher's circle/squircle mask doesn't
       crop important pixels. -->

  <g transform="translate(512 512) scale(0.78)">
    <!-- outer ring -->
    <circle r="380" fill="none" stroke="url(#goldStroke)" stroke-width="8" stroke-opacity="0.95"/>
    <circle r="320" fill="none" stroke="#F6C85F" stroke-width="4" stroke-opacity="0.55"/>
    <circle r="210" fill="none" stroke="#F6C85F" stroke-width="2.5" stroke-opacity="0.45" stroke-dasharray="14 18"/>

    <g stroke="url(#goldStroke)" stroke-width="4" stroke-opacity="0.85">
      <line x1="0" y1="-380" x2="0" y2="-320"/>
      <line x1="190" y1="-329" x2="160" y2="-277"/>
      <line x1="329" y1="-190" x2="277" y2="-160"/>
      <line x1="380" y1="0" x2="320" y2="0"/>
      <line x1="329" y1="190" x2="277" y2="160"/>
      <line x1="190" y1="329" x2="160" y2="277"/>
      <line x1="0" y1="380" x2="0" y2="320"/>
      <line x1="-190" y1="329" x2="-160" y2="277"/>
      <line x1="-329" y1="190" x2="-277" y2="160"/>
      <line x1="-380" y1="0" x2="-320" y2="0"/>
      <line x1="-329" y1="-190" x2="-277" y2="-160"/>
      <line x1="-190" y1="-329" x2="-160" y2="-277"/>
    </g>

    <polygon
      points="0,-200 40,-50 160,-80 80,40 200,80 50,80 80,200 0,90 -80,200 -50,80 -200,80 -80,40 -160,-80 -40,-50"
      fill="url(#centerStar)" fill-opacity="0.95"
    />
    <circle r="38" fill="#FFFAEB"/>
  </g>
</svg>
