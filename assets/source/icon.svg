<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#3A1B6D" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#11102A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#080817" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD98A" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#F6C85F" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F6C85F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD98A"/>
      <stop offset="100%" stop-color="#B98A3A"/>
    </linearGradient>
    <radialGradient id="centerStar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFAEB"/>
      <stop offset="60%" stop-color="#FFD98A"/>
      <stop offset="100%" stop-color="#F6C85F"/>
    </radialGradient>
  </defs>

  <!-- background fills the whole canvas; iOS strips alpha, so this MUST be opaque -->
  <rect width="1024" height="1024" fill="#080817"/>
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- halo -->
  <circle cx="512" cy="512" r="430" fill="url(#halo)"/>

  <!-- outer ring -->
  <circle cx="512" cy="512" r="380" fill="none" stroke="url(#goldStroke)" stroke-width="6" stroke-opacity="0.95"/>
  <!-- mid ring -->
  <circle cx="512" cy="512" r="320" fill="none" stroke="#F6C85F" stroke-width="3" stroke-opacity="0.55"/>
  <!-- inner dashed ring -->
  <circle cx="512" cy="512" r="210" fill="none" stroke="#F6C85F" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="14 18"/>

  <!-- 12 zodiac tick marks between mid and outer rings -->
  <g stroke="url(#goldStroke)" stroke-width="3" stroke-opacity="0.85">
    <line x1="512" y1="132" x2="512" y2="192"/>
    <line x1="710" y1="184" x2="681" y2="237"/>
    <line x1="853" y1="328" x2="803" y2="361"/>
    <line x1="892" y1="512" x2="832" y2="512"/>
    <line x1="853" y1="696" x2="803" y2="663"/>
    <line x1="710" y1="840" x2="681" y2="787"/>
    <line x1="512" y1="892" x2="512" y2="832"/>
    <line x1="314" y1="840" x2="343" y2="787"/>
    <line x1="171" y1="696" x2="221" y2="663"/>
    <line x1="132" y1="512" x2="192" y2="512"/>
    <line x1="171" y1="328" x2="221" y2="361"/>
    <line x1="314" y1="184" x2="343" y2="237"/>
  </g>

  <!-- 8-point star at center -->
  <g transform="translate(512 512)">
    <polygon
      points="0,-200 40,-50 160,-80 80,40 200,80 50,80 80,200 0,90 -80,200 -50,80 -200,80 -80,40 -160,-80 -40,-50"
      fill="url(#centerStar)"
      fill-opacity="0.95"
    />
    <circle cx="0" cy="0" r="38" fill="#FFFAEB"/>
  </g>

  <!-- scattered tiny stars -->
  <g fill="#FFFFFF" fill-opacity="0.85">
    <circle cx="180" cy="220" r="3"/>
    <circle cx="860" cy="200" r="4"/>
    <circle cx="900" cy="780" r="3"/>
    <circle cx="140" cy="800" r="3.5"/>
    <circle cx="320" cy="120" r="2"/>
    <circle cx="780" cy="900" r="2.5"/>
  </g>
  <g fill="#F6C85F" fill-opacity="0.85">
    <circle cx="240" cy="900" r="2"/>
    <circle cx="820" cy="120" r="2"/>
    <circle cx="100" cy="500" r="2.5"/>
    <circle cx="924" cy="500" r="2.5"/>
  </g>
</svg>
