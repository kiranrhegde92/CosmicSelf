<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1284 2778" width="1284" height="2778">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080817"/>
      <stop offset="40%" stop-color="#11102A"/>
      <stop offset="75%" stop-color="#1A1138"/>
      <stop offset="100%" stop-color="#080817"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#3A1B6D" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3A1B6D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD98A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F6C85F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD98A"/>
      <stop offset="100%" stop-color="#B98A3A"/>
    </linearGradient>
    <radialGradient id="centerStar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFAEB"/>
      <stop offset="60%" stop-color="#FFD98A"/>
      <stop offset="100%" stop-color="#F6C85F"/>
    </radialGradient>
  </defs>

  <rect width="1284" height="2778" fill="url(#bg)"/>
  <rect width="1284" height="2778" fill="url(#topGlow)"/>

  <!-- halo + zodiac wheel, vertically centered. The native splash screen
       crops/scales contain — keep the focal element near the middle. -->
  <g transform="translate(642 1389)">
    <circle r="700" fill="url(#halo)"/>

    <circle r="500" fill="none" stroke="url(#goldStroke)" stroke-width="6" stroke-opacity="0.85"/>
    <circle r="420" fill="none" stroke="#F6C85F" stroke-width="3" stroke-opacity="0.45"/>
    <circle r="280" fill="none" stroke="#F6C85F" stroke-width="2.5" stroke-opacity="0.35" stroke-dasharray="16 22"/>

    <g stroke="url(#goldStroke)" stroke-width="3" stroke-opacity="0.85">
      <line x1="0" y1="-500" x2="0" y2="-420"/>
      <line x1="250" y1="-433" x2="210" y2="-364"/>
      <line x1="433" y1="-250" x2="364" y2="-210"/>
      <line x1="500" y1="0" x2="420" y2="0"/>
      <line x1="433" y1="250" x2="364" y2="210"/>
      <line x1="250" y1="433" x2="210" y2="364"/>
      <line x1="0" y1="500" x2="0" y2="420"/>
      <line x1="-250" y1="433" x2="-210" y2="364"/>
      <line x1="-433" y1="250" x2="-364" y2="210"/>
      <line x1="-500" y1="0" x2="-420" y2="0"/>
      <line x1="-433" y1="-250" x2="-364" y2="-210"/>
      <line x1="-250" y1="-433" x2="-210" y2="-364"/>
    </g>

    <polygon
      points="0,-260 50,-65 210,-100 100,50 260,100 65,100 100,260 0,115 -100,260 -65,100 -260,100 -100,50 -210,-100 -50,-65"
      fill="url(#centerStar)" fill-opacity="0.95"
    />
    <circle r="48" fill="#FFFAEB"/>
  </g>

  <!-- scattered stars -->
  <g fill="#FFFFFF" fill-opacity="0.85">
    <circle cx="200"  cy="400"  r="4"/>
    <circle cx="1080" cy="320"  r="5"/>
    <circle cx="960"  cy="2200" r="4"/>
    <circle cx="180"  cy="2300" r="4.5"/>
    <circle cx="380"  cy="220"  r="2.5"/>
    <circle cx="900"  cy="2440" r="3"/>
    <circle cx="700"  cy="160"  r="2.5"/>
    <circle cx="120"  cy="1700" r="3"/>
  </g>
  <g fill="#F6C85F" fill-opacity="0.9">
    <circle cx="280"  cy="900"  r="3"/>
    <circle cx="1100" cy="1900" r="3"/>
    <circle cx="160"  cy="2580" r="2.5"/>
    <circle cx="1080" cy="2580" r="2.5"/>
  </g>
</svg>
