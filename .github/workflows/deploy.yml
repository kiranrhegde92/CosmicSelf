name: Deploy backend

# Deploys Cloud Functions, Firestore rules, and Storage rules whenever
# anything backend-shaped lands on a deployable branch:
#   - main      -> production
#   - staging   -> staging
# The path filter keeps screen-only PRs from triggering an infra deploy.
#
# Required GitHub repo secrets (one set per environment):
#   FIREBASE_SERVICE_ACCOUNT_PROD
#   FIREBASE_SERVICE_ACCOUNT_STAGING
#     - JSON for a service account in the matching project, with roles:
#         roles/cloudfunctions.admin, roles/datastore.indexAdmin,
#         roles/firebaserules.admin, roles/firebase.admin
#
# Project IDs come from .firebaserc aliases (`prod` / `staging`). Update the
# IDs there, not in this workflow.
#
# Functions secrets (ANTHROPIC_API_KEY, OPENAI_API_KEY) live in Firebase
# Secret Manager per project — set once via `firebase functions:secrets:set
# ANTHROPIC_API_KEY --project staging` and the deploy inherits them. They
# never enter this workflow file.

on:
  push:
    branches: [main, staging]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target (prod or staging)'
        required: true
        default: 'staging'
        type: choice
        options: [prod, staging]

concurrency:
  # Different envs deploy in parallel; same env serializes.
  group: backend-deploy-${{ github.event.inputs.target || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Branch -> firebase project alias mapping. Manual runs use the
      # workflow_dispatch input.
      - name: Resolve target environment
        id: target
        run: |
          if [ -n "${{ github.event.inputs.target }}" ]; then
            target="${{ github.event.inputs.target }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            target="prod"
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            target="staging"
          else
            echo "Unsupported branch '${{ github.ref_name }}' for deploy" >&2
            exit 1
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "Deploying to: $target"

      - name: Pick service account secret
        id: creds
        env:
          PROD_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}
          STAGING_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
        run: |
          if [ "${{ steps.target.outputs.target }}" = "prod" ]; then
            sa="$PROD_SA"
          else
            sa="$STAGING_SA"
          fi
          if [ -z "$sa" ]; then
            echo "Service account secret for ${{ steps.target.outputs.target }} is not set" >&2
            exit 1
          fi
          # Mask + export. Use a delimiter so multiline JSON survives.
          {
            echo "FIREBASE_SERVICE_ACCOUNT_JSON<<EOF_SA_$$"
            echo "$sa"
            echo "EOF_SA_$$"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$sa"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions deps
        working-directory: functions
        run: npm ci

      - name: Build Functions
        working-directory: functions
        run: npm run build

      # Auth via service account JSON so the workflow can deploy without a
      # long-lived `firebase login:ci` token.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Setup Firebase CLI
        run: npm install -g firebase-tools@13

      - name: Deploy Firestore rules + indexes
        run: |
          firebase deploy \
            --only firestore:rules,firestore:indexes \
            --project "${{ steps.target.outputs.target }}" \
            --non-interactive

      - name: Deploy Storage rules
        run: |
          firebase deploy \
            --only storage \
            --project "${{ steps.target.outputs.target }}" \
            --non-interactive

      - name: Deploy Functions
        run: |
          firebase deploy \
            --only functions \
            --project "${{ steps.target.outputs.target }}" \
            --non-interactive
