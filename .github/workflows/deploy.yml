name: Deploy backend

# Deploys Cloud Functions, Firestore rules, and Storage rules whenever
# anything backend-shaped lands on main. The path filter keeps screen-only
# PRs from triggering an infra deploy.
#
# Required GitHub repo secrets:
#   FIREBASE_SERVICE_ACCOUNT  - JSON for a service account with
#                                roles/cloudfunctions.admin,
#                                roles/datastore.indexAdmin,
#                                roles/firebaserules.admin,
#                                roles/firebase.admin
#   FIREBASE_PROJECT_ID       - e.g. cosmicself-prod
#
# (For functions secrets like ANTHROPIC_API_KEY, those live in Firebase
# Secrets — set once via `firebase functions:secrets:set` and the deploy
# inherits them. They never enter this workflow file.)

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'firebase.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions deps
        working-directory: functions
        run: npm ci

      - name: Build Functions
        working-directory: functions
        run: npm run build

      # Auth via service account JSON so the workflow can deploy without a
      # long-lived `firebase login:ci` token.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Setup Firebase CLI
        run: npm install -g firebase-tools@13

      - name: Deploy Firestore rules + indexes
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          firebase deploy \
            --only firestore:rules,firestore:indexes \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive

      - name: Deploy Storage rules
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          firebase deploy \
            --only storage \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive

      - name: Deploy Functions
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          firebase deploy \
            --only functions \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive
